<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Monitor frame -->
  <rect x="96" y="100" width="320" height="220" rx="16" ry="16" fill="#2d3748"/>

  <!-- Screen -->
  <rect x="112" y="116" width="288" height="188" rx="8" ry="8" fill="url(#screenGrad)"/>

  <!-- Code lines -->
  <rect x="136" y="145" width="80" height="12" rx="6" fill="#63b3ed"/>
  <rect x="136" y="170" width="140" height="12" rx="6" fill="#68d391"/>
  <rect x="136" y="195" width="100" height="12" rx="6" fill="#f6ad55"/>
  <rect x="136" y="220" width="180" height="12" rx="6" fill="#fc8181"/>
  <rect x="136" y="245" width="60" height="12" rx="6" fill="#b794f4"/>

  <!-- Cursor blink -->
  <rect x="206" y="245" width="3" height="16" rx="1" fill="#fff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Monitor stand -->
  <rect x="216" y="320" width="80" height="20" rx="4" fill="#2d3748"/>
  <rect x="186" y="340" width="140" height="16" rx="8" fill="#2d3748"/>

  <!-- Magic sparkles -->
  <g fill="#ffd700">
    <circle cx="380" cy="140" r="8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="180" r="5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="170" r="6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Keyboard hint -->
  <g transform="translate(320, 260)">
    <rect x="0" y="0" width="70" height="35" rx="6" fill="#4a5568"/>
    <text x="35" y="24" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">TYPE</text>
  </g>
</svg>
